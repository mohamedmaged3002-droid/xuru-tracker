name: sync

# Availability + rates from Xuru's API -> GitHub Pages .ics + Supabase.
# Cadence is a correctness parameter, not a preference (L-095): the shorter the gap,
# the smaller the double-booking window. Xuru's own calendar is the only signal we
# have, so we resync every 2 hours — matching the Brassbell cadence (D-043).
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

# Never let two runs scrape Xuru concurrently.
concurrency:
  group: xuru-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # Node 20 is deprecated across the BlueKeys cron repos

      - name: Refresh catalogue
        run: node src/catalogue.js

      - name: Build .ics feeds
        run: node src/build-ics.js data/units

      - name: Sweep month totals (change detector)
        run: node src/sweep-months.js data/units

      - name: Write prices + calendar to Supabase
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/push-db.js

      - name: Commit feeds
        run: |
          git config user.name  "xuru-tracker"
          git config user.email "actions@github.com"
          git add docs data
          # Never fail the run just because nothing changed.
          git diff --staged --quiet || git commit -m "sync: refresh feeds + rates [skip ci]"
          git push || true
