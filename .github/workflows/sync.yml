name: calendar-sync

# Availability -> GitHub Pages .ics. This is the double-booking-critical path, so it
# runs often. It is also cheap: the availability bitmap arrives with the unit detail,
# so a full refresh is ~166 requests (one per unit), not a calendar probe.
#
# Cadence is a correctness parameter (L-095): the gap between runs is the window in
# which we can sell a night Xuru has already sold. 2h matches Brassbell (D-043).
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

# Its OWN group, deliberately not shared with rates.yml. The shared group meant a
# multi-hour rate sweep queued the calendar behind it — and a stale calendar is how
# you double-book. Contention with the sweep is handled in the client instead: a 429
# slows the whole run down adaptively (src/lib.js).
concurrency:
  group: xuru-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # Node 20 is deprecated across the BlueKeys cron repos

      - name: Refresh catalogue
        run: node src/catalogue.js

      - name: Build .ics feeds
        run: node src/build-ics.js data/units

      - name: Commit feeds
        run: |
          git config user.name  "xuru-tracker"
          git config user.email "actions@github.com"
          # Only what this workflow owns. data/r2-photos.json and data/photo-plan.json
          # are local photo-pipeline state — committing them from CI clobbers a
          # running upload and guarantees rebase conflicts.
          git add docs data/roster.json
          # Never fail the run just because nothing changed.
          git diff --staged --quiet || git commit -m "calendar: refresh feeds [skip ci]"
          git push || true
