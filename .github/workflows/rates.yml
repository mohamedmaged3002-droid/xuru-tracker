name: rate-sweep

# Per-night rates. Deliberately DAILY, not hourly.
#
# Each stay quote costs Xuru's booking API ~3s, so even the cheap path (12 month
# totals per unit = ~2,000 requests) takes ~100 minutes wall-clock. Running this on
# the 2h calendar cadence would mean hammering a partner's production site
# continuously, for data that moves far more slowly than availability does.
#
# The month totals stored here are what let the per-night pass skip unchanged months
# (27 probes -> 2). Ask Xuru for read-only BookingSync API access and this whole
# workflow collapses into one rate-periods call per unit.
on:
  schedule:
    - cron: '40 2 * * *'          # 02:40 UTC, off-peak for Egypt
  workflow_dispatch:

concurrency:
  group: xuru-api
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh catalogue
        run: node src/catalogue.js

      - name: Sweep month totals
        run: node src/sweep-months.js data/units

      - name: Commit rates
        run: |
          git config user.name  "xuru-tracker"
          git config user.email "actions@github.com"
          git add data/month-totals.json data/roster.json
          git diff --staged --quiet || git commit -m "rates: refresh month totals [skip ci]"
          git push || true
