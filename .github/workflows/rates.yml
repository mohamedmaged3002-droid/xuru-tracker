name: rate-sweep

# Per-NIGHT rates, daily. Xuru prices every night differently, so this stores an
# exact rate per date rather than a monthly average.
#
# The near horizon (120 days) is always fully re-probed; beyond that a month total
# acts as a 30-night change detector and unchanged months are carried forward.
# Steady state is ~21k requests (~90 min); the first cold run is ~60k (~4h).
#
# Ask Xuru for read-only BookingSync API access and this whole workflow collapses
# into one rate-periods call per unit.
on:
  schedule:
    - cron: '40 2 * * *'          # 02:40 UTC, off-peak for Egypt
  workflow_dispatch:

concurrency:
  group: xuru-rates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh catalogue
        run: node src/catalogue.js

      - name: Sweep per-night rates
        env:
          HORIZON_DAYS: '365'
          NEAR_DAYS: '120'
        run: node src/sweep-nights.js data/units

      - name: Install mail dependency
        # Only needed for the change alert. --no-save keeps the repo lockfile-free;
        # everything else in this repo runs on stdlib + fetch.
        run: npm install nodemailer@^7 --no-audit --no-fund --no-save

      - name: Push prices to Supabase
        # Skips itself (exit 0) when the secrets are absent, so a fork or an
        # unconfigured repo still gets a green sweep instead of a red X.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: node src/push-db.mjs

      - name: Commit rates
        run: |
          git config user.name  "xuru-tracker"
          git config user.email "actions@github.com"
          git add data/night-rates.json data/roster.json
          git diff --staged --quiet || git commit -m "rates: refresh per-night prices [skip ci]"
          git push || true
